---
- name: Install Vim and Basic Packages
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - vim
          - curl
          - wget
          - git
          - htop
          - net-tools
          - ca-certificates
          - unzip
          - zip
        state: present
- name: Prepare Ubuntu for Kubernetes (swap, kernel, sysctl, repo, kube tools)
  hosts: k8s_nodes
  become: true
  gather_facts: true
  vars_files:
    - vault.yml

  vars:
    k8s_version_channel: "v1.30"
    k8s_repo_url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_version_channel }}/deb/"
    k8s_key_url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_version_channel }}/deb/Release.key"
    k8s_keyring_dir: "/etc/apt/keyrings"
    k8s_keyring_path: "/etc/apt/keyrings/kubernetes-apt-keyring.gpg"
    k8s_repo_list_path: "/etc/apt/sources.list.d/kubernetes.list"

    k8s_modules_conf: "/etc/modules-load.d/k8s.conf"
    k8s_sysctl_conf: "/etc/sysctl.d/k8s.conf"

    k8s_packages:
      - kubelet
      - kubeadm
      - kubectl

  tasks:
    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Comment swap lines in /etc/fstab (to keep it disabled after reboot)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: "^(?!#)(.*\\s+swap\\s+.*)$"
        replace: "# \\1"

    - name: Create /etc/modules-load.d/k8s.conf
      ansible.builtin.copy:
        dest: "{{ k8s_modules_conf }}"
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load overlay module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Create /etc/sysctl.d/k8s.conf
      ansible.builtin.copy:
        dest: "{{ k8s_sysctl_conf }}"
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Apply sysctl (equivalent to sysctl --system)
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Remove old Kubernetes/Google lists (if they exist)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/kubernetes.list
        - /etc/apt/sources.list.d/k8s.list

    - name: Remove any old kubernetes/google related files in sources.list.d
      ansible.builtin.shell: |
        rm -f /etc/apt/sources.list.d/*kubernetes* /etc/apt/sources.list.d/*google* || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install dependencies (ca-certificates, curl, gpg)
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - curl
          - gpg
        state: present

    - name: Ensure keyrings directory
      ansible.builtin.file:
        path: "{{ k8s_keyring_dir }}"
        state: directory
        mode: "0755"

    - name: Download Kubernetes Release.key
      ansible.builtin.get_url:
        url: "{{ k8s_key_url }}"
        dest: /tmp/kubernetes-release.key
        mode: "0644"

    - name: Convert key to keyring (gpg --dearmor)
      ansible.builtin.command: >
        gpg --dearmor -o {{ k8s_keyring_path }} /tmp/kubernetes-release.key
      args:
        creates: "{{ k8s_keyring_path }}"

    - name: Set keyring permission
      ansible.builtin.file:
        path: "{{ k8s_keyring_path }}"
        mode: "0644"

    - name: Create Kubernetes repository file
      ansible.builtin.copy:
        dest: "{{ k8s_repo_list_path }}"
        mode: "0644"
        content: |
          deb [signed-by={{ k8s_keyring_path }}] {{ k8s_repo_url }} /

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install kubelet/kubeadm/kubectl
      ansible.builtin.apt:
        name: "{{ k8s_packages }}"
        state: present

    - name: Hold Kubernetes package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ k8s_packages }}"

    - name: Verify installed versions
      ansible.builtin.shell: |
        set -e
        kubelet --version
        kubeadm version
        kubectl version --client
      args:
        executable: /bin/bash
      register: k8s_versions
      changed_when: false

    - name: Show versions
      ansible.builtin.debug:
        var: k8s_versions.stdout_lines

- name: Part 2 - Install and configure containerd (Docker repo) + enable kubelet
  hosts: k8s_nodes
  become: true
  gather_facts: true

  vars_files:
    - vault.yml

  vars:
    docker_keyring_dir: /usr/share/keyrings
    docker_keyring_path: /usr/share/keyrings/docker-archive-keyring.gpg
    docker_gpg_url: https://download.docker.com/linux/ubuntu/gpg
    docker_repo_list_path: /etc/apt/sources.list.d/docker.list

    containerd_config_path: /etc/containerd/config.toml
    cri_socket: "unix:///run/containerd/containerd.sock"

  tasks:
    - name: Install basic dependencies (APT/HTTPS/GPG)
      ansible.builtin.apt:
        update_cache: true
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Ensure Docker keyring directory
      ansible.builtin.file:
        path: "{{ docker_keyring_dir }}"
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: "{{ docker_gpg_url }}"
        dest: /tmp/docker.gpg
        mode: "0644"

    - name: Convert Docker key to keyring (gpg --dearmor)
      ansible.builtin.command: >
        gpg --dearmor -o {{ docker_keyring_path }} /tmp/docker.gpg
      args:
        creates: "{{ docker_keyring_path }}"

    - name: Set Docker keyring permission
      ansible.builtin.file:
        path: "{{ docker_keyring_path }}"
        mode: "0644"

    - name: Add official Docker repository (stable)
      ansible.builtin.copy:
        dest: "{{ docker_repo_list_path }}"
        mode: "0644"
        content: |
          deb [arch=amd64 signed-by={{ docker_keyring_path }}] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable

    - name: Update apt cache (with Docker repo)
      ansible.builtin.apt:
        update_cache: true

    - name: Install containerd.io
      ansible.builtin.apt:
        name:
          - containerd.io
        state: present

    - name: Ensure /etc/containerd directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate default containerd config (always overwrites)
      ansible.builtin.shell: |
        set -e
        containerd config default > {{ containerd_config_path }}
      args:
        executable: /bin/bash
      changed_when: true
      notify: Restart containerd

    - name: Set SystemdCgroup = true (required for kubelet)
      ansible.builtin.replace:
        path: "{{ containerd_config_path }}"
        regexp: "SystemdCgroup\\s*=\\s*false"
        replace: "SystemdCgroup = true"
      notify: Restart containerd

    - name: Ensure containerd is enabled and running
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started

    - name: Validate containerd is active
      ansible.builtin.command: systemctl is-active containerd
      register: containerd_active
      changed_when: false
      failed_when: containerd_active.stdout.strip() != "active"

    - name: Enable and start kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

    - name: Show kubelet status (informational)
      ansible.builtin.command: systemctl is-active kubelet
      register: kubelet_active
      changed_when: false
      failed_when: kubelet_active.stdout.strip() not in ["active", "activating"]

    - name: Debug status
      ansible.builtin.debug:
        msg:
          - "containerd status: {{ containerd_active.stdout.strip() }}"
          - "kubelet status: {{ kubelet_active.stdout.strip() }}"
          - "expected cri socket: {{ cri_socket }}"

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

- name: Part 3 - Initialize control-plane with kubeadm and generate join command
  hosts: k8s_controller
  become: true
  gather_facts: true

  vars_files:
    - vault.yml

  vars:
    pod_network_cidr_resolved: "{{ pod_network_cidr | default('10.10.0.0/16') }}"
    apiserver_advertise_address_resolved: "{{ apiserver_advertise_address | default(hostvars[groups['k8s_controller'][0]].ansible_host | default(groups['k8s_controller'][0])) }}"
    kube_admin_user_resolved: "{{ kube_admin_user | default(ansible_user) }}"
    kube_admin_group_resolved: "{{ kube_admin_group | default(kube_admin_user_resolved) }}"
    kube_admin_home_resolved: "{{ kube_admin_home | default('/home/' ~ kube_admin_user_resolved if kube_admin_user_resolved != 'root' else '/root') }}"
    kubeconfig_src: "/etc/kubernetes/admin.conf"
    kubeconfig_dir: "{{ kube_admin_home_resolved }}/.kube"
    kubeconfig_dest: "{{ kubeconfig_dir }}/config"
    cri_socket: "unix:///run/containerd/containerd.sock"

  tasks:
    - name: Check if the cluster has already been initialized
      ansible.builtin.stat:
        path: "{{ kubeconfig_src }}"
      register: adminconf

    - name: Run kubeadm init (only if not initialized yet)
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr_resolved }}
        --apiserver-advertise-address={{ apiserver_advertise_address_resolved }}
        --cri-socket={{ cri_socket }}
      when: not adminconf.stat.exists
      register: kubeadm_init
      changed_when: true

    - name: Ensure .kube directory for kubectl user
      ansible.builtin.file:
        path: "{{ kubeconfig_dir }}"
        state: directory
        owner: "{{ kube_admin_user_resolved }}"
        group: "{{ kube_admin_group_resolved }}"
        mode: "0700"

    - name: Copy admin.conf for kubectl user
      ansible.builtin.copy:
        src: "{{ kubeconfig_src }}"
        dest: "{{ kubeconfig_dest }}"
        remote_src: true
        owner: "{{ kube_admin_user_resolved }}"
        group: "{{ kube_admin_group_resolved }}"
        mode: "0600"

    - name: Generate join command (always)
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: PRINT JOIN COMMAND
      ansible.builtin.debug:
        msg: "{{ join_cmd.stdout }}"

- name: Part 3 - Run kubeadm join on workers
  hosts: k8s_workers
  become: true
  gather_facts: true

  vars_files:
    - vault.yml

  vars:
    cri_socket: "unix:///run/containerd/containerd.sock"
    join_command: "{{ hostvars[groups['k8s_controller'][0]].join_cmd.stdout }}"

  tasks:
    - name: Check if worker is already in the cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: worker_joined

    - name: Run kubeadm join (only if not joined yet)
      ansible.builtin.command: >
        {{ join_command }}
        --cri-socket={{ cri_socket }}
        --v=2
      when: not worker_joined.stat.exists
      changed_when: true

- name: Part 4 - Install Calico (CNI) and wait for cluster to become Ready
  hosts: k8s_controller
  become: true
  gather_facts: true

  vars_files:
    - vault.yml

  vars:
    pod_network_cidr_resolved: "{{ pod_network_cidr | default('10.10.0.0/16') }}"
    calico_version: "v3.27.3"
    calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"
    calico_manifest_path: "/tmp/calico.yaml"
    kube_admin_user_resolved: "{{ kube_admin_user | default(ansible_user) }}"
    kube_admin_home_resolved: "{{ kube_admin_home | default('/home/' ~ kube_admin_user_resolved if kube_admin_user_resolved != 'root' else '/root') }}"
    kubeconfig_path: "{{ kube_admin_home_resolved }}/.kube/config"

  tasks:
    - name: Ensure kubectl user kubeconfig exists on control-plane
      ansible.builtin.stat:
        path: "{{ kubeconfig_path }}"
      register: kubeconfig_stat

    - name: Fail if kubeconfig does not exist (run Part 3 first)
      ansible.builtin.fail:
        msg: "Could not find {{ kubeconfig_path }}. Run Part 3 (kubeadm init + copy admin.conf) first."
      when: not kubeconfig_stat.stat.exists

    - name: Download Calico manifest
      ansible.builtin.get_url:
        url: "{{ calico_manifest_url }}"
        dest: "{{ calico_manifest_path }}"
        mode: "0644"

    - name: Adjust Pod CIDR in Calico manifest (if default value exists)
      ansible.builtin.replace:
        path: "{{ calico_manifest_path }}"
        regexp: "192\\.168\\.0\\.0/16"
        replace: "{{ pod_network_cidr_resolved }}"

    - name: Apply Calico to cluster (kubectl apply)
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ calico_manifest_path }}
      register: calico_apply
      changed_when: "'configured' in calico_apply.stdout or 'created' in calico_apply.stdout"

    - name: Wait for calico-node (DaemonSet) to be ready
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }}
        -n kube-system rollout status daemonset/calico-node --timeout=300s
      register: calico_node_rollout
      changed_when: false

    - name: Wait for calico-kube-controllers (Deployment) to be ready
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }}
        -n kube-system rollout status deployment/calico-kube-controllers --timeout=300s
      register: calico_ctrl_rollout
      changed_when: false

    - name: Show Calico pods
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }}
        -n kube-system get pods -l k8s-app=calico-node -o wide
      register: calico_pods
      changed_when: false

    - name: Show nodes (it may take a few seconds to become Ready)
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} get nodes -o wide
      register: nodes_out
      changed_when: false

    - name: Final output
      ansible.builtin.debug:
        msg:
          - "Calico apply: {{ calico_apply.stdout | default('') }}"
          - "calico-node rollout: {{ calico_node_rollout.stdout | default('') }}"
          - "calico-kube-controllers rollout: {{ calico_ctrl_rollout.stdout | default('') }}"
          - "{{ calico_pods.stdout_lines }}"
          - "{{ nodes_out.stdout_lines }}"
