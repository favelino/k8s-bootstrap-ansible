---
name: Kubernetes CI

"on":
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible + linters
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint yamllint

      - name: YAML lint
        run: yamllint .

      - name: Ansible lint
        run: ansible-lint .

      - name: Syntax check playbooks
        run: |
          for f in *.yml; do
            echo "Syntax-check: $f"
            ansible-playbook --syntax-check "$f"
          done
